name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
        laravel: [ '13.*', '12.*', '11.*', '10.*' ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
          - laravel: '10.*'
            testbench: '8.37.*'
            pest: '2.35.*'
            pest_plugin_laravel: '2.4.*'
          - laravel: '11.*'
            testbench: '9.17.*'
            pest: '2.35.*'
            pest_plugin_laravel: '2.4.*'
          - laravel: '12.*'
            testbench: '10.11.*'
            pest: '3.8.*'
            pest_plugin_laravel: '3.2.*'
          - laravel: '13.*'
            testbench: '11.0.*'
            pest: '4.4.*'
            pest_plugin_laravel: '4.1.*'
        exclude:
          - laravel: '11.*'
            php: '8.1'
          - laravel: '12.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.1'
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          ini-values: memory_limit=-1

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin_laravel }}" --dev --no-interaction --no-update

          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-audit

      - name: Execute tests (Unix)
        if: matrix.os != 'windows-latest'
        run: ./vendor/bin/pest

      - name: Execute tests (Windows)
        if: matrix.os == 'windows-latest'
        run: vendor\bin\pest
