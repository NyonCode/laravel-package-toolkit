name: Tests

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        php: [ 8.1, 8.2, 8.3, 8.4 ]
        laravel: [ 12.*, 11.*, 10.*, 9.* ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
          - laravel: 9.*
            testbench: 7.*
            pest: 1.*
          - laravel: 10.*
            testbench: 8.*
            pest: 2.*
          - laravel: 11.*
            testbench: 9.*
            pest: 2.*
          - laravel: 12.*
            testbench: 10.*
            pest: 3.*
        exclude:
          - laravel: 11.*
            php: 8.1
          - laravel: 12.*
            php: 8.1

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          ini-values: memory_limit=-1

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer config audit.ignore-advisories true
          composer config audit.abandoned ignore

          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" --dev --no-interaction --no-update

          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-audit

      - name: Execute tests (Unix)
        if: matrix.os != 'windows-latest'
        run: ./vendor/bin/pest

      - name: Execute tests (Windows)
        if: matrix.os == 'windows-latest'
        run: vendor\bin\pest